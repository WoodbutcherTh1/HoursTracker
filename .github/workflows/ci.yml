name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs that only need to read the repo.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2.3.9 — CI-only supply-chain exception (not shipped in the app).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint (strict)
        run: swiftlint lint --strict --config .swiftlint.yml

  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid // empty')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator; creating one."
            RUNTIME=$(xcrun simctl list runtimes --json \
              | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | sort_by(.version) | last.identifier')
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json \
              | jq -r '[.devicetypes[] | select(.productFamily == "iPhone")] | last.identifier')
            UDID=$(xcrun simctl create "CI iPhone" "$DEVICE_TYPE" "$RUNTIME")
          fi
          echo "Using simulator $UDID"
          xcrun simctl list devices available
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild test \
            -project HoursTracker.xcodeproj \
            -scheme HoursTracker \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
