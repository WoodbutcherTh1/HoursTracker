name: HoursTracker
options:
  bundleIdPrefix: com.hourstracker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  HoursTracker:
    type: application
    platform: iOS
    sources:
      - path: HoursTracker
        excludes:
          - Info.plist
    resources:
      - path: HoursTracker/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app
        INFOPLIST_FILE: HoursTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: HoursTracker/HoursTracker.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: HoursTracker/HoursTracker.entitlements
    scheme:
      testTargets:
        - HoursTrackerTests
    info:
      path: HoursTracker/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes:
          - location
        NSLocationAlwaysAndWhenInUseUsageDescription: "Background location is used only to remind you to clock in when you arrive at the workplace you saved. We do not continuously track you."
        NSLocationWhenInUseUsageDescription: "SaatMark uses your location while using the app only to save your workplace when you tap Set Location."
        NSLocationAlwaysUsageDescription: "Always location is used only for workplace arrival reminders. You can turn arrival reminders off anytime in Settings."
        NSCameraUsageDescription: "SaatMark uses the camera only to photograph a printed timesheet so you can import clock-in and clock-out times."
        NSPhotoLibraryUsageDescription: "SaatMark needs photo access only to import a timesheet screenshot or image you choose."
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - ar
          - he
  HoursTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HoursTrackerTests
    dependencies:
      - target: HoursTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.tests
        GENERATE_INFOPLIST_FILE: YES
