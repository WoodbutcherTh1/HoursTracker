name: HoursTracker
options:
  bundleIdPrefix: com.hourstracker
  deploymentTarget:
    iOS: "17.0"
  # Apple requires the iOS 26 SDK (Xcode 26+) for all App Store submissions
  # as of 28 April 2026. Build with Xcode 26.x locally before archiving.
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  HoursTracker:
    type: application
    platform: iOS
    sources:
      - path: HoursTracker
        excludes:
          - Info.plist
    resources:
      - path: HoursTracker/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app
        INFOPLIST_FILE: HoursTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: HoursTracker/HoursTracker.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: HoursTracker/HoursTracker.entitlements
    dependencies:
      - target: HoursTrackerWatch
        embed: true
      - target: HoursTrackerWidget
        embed: true
    scheme:
      testTargets:
        - HoursTrackerTests
    info:
      path: HoursTracker/Info.plist
      properties:
        CFBundleDisplayName: HoursTracker
        # 1.2 was already approved on the App Store — that pre-release train is
        # permanently closed to new TestFlight builds, so any new submission needs
        # a higher marketing version even if it's otherwise a minor update.
        CFBundleShortVersionString: "1.3"
        # Build 15+: do NOT add UIBackgroundModes: location (Guideline 2.5.4).
        # Arrival reminders use CLCircularRegion monitoring only.
        CFBundleVersion: "19"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationAlwaysAndWhenInUseUsageDescription: "Always access is used only for optional workplace arrival reminders via region monitoring (one geofence you set). HoursTracker does not continuously track your location in the background."
        NSLocationWhenInUseUsageDescription: "HoursTracker uses your location while using the app only to save your workplace when you tap Set Location."
        NSCameraUsageDescription: "HoursTracker uses the camera only to photograph a printed timesheet so you can import clock-in and clock-out times."
        NSPhotoLibraryUsageDescription: "HoursTracker needs photo access only to import a timesheet screenshot or image you choose."
        NSFaceIDUsageDescription: "HoursTracker uses Face ID only to unlock the app when App Lock is enabled."
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - ar
          - he
        # Lock Screen widget tap target — see HoursTrackerApp.swift's onOpenURL.
        CFBundleURLTypes:
          - CFBundleURLName: com.hourstracker.app
            CFBundleURLSchemes:
              - hourstracker
  # Lock Screen status widget — read-only display (isClockedIn / clockInDate) shared
  # from the phone via an App Group UserDefaults suite (see WidgetStatusStore.swift);
  # the widget never writes shared state. Tapping it opens the app via the
  # `hourstracker://clockIn` / `hourstracker://clockOut` URL scheme, which performs the actual clock in/out
  # through the normal AppViewModel path — deliberately not an in-widget AppIntent
  # mutation, to avoid a second write path onto session data. Requires the App Group
  # entitlement (group.com.hourstracker.app) on both this target and HoursTracker's —
  # already wired via the entitlements: blocks below and on the HoursTracker target.
  # NOT verified against a real build.
  HoursTrackerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HoursTrackerWidget
        excludes:
          - Info.plist
          - HoursTrackerWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.widget
        INFOPLIST_FILE: HoursTrackerWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO
    entitlements:
      path: HoursTrackerWidget/HoursTrackerWidget.entitlements
    info:
      path: HoursTrackerWidget/Info.plist
      properties:
        CFBundleDisplayName: HoursTracker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  HoursTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HoursTrackerTests
    dependencies:
      - target: HoursTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.tests
        GENERATE_INFOPLIST_FILE: YES
  # Companion watch app — modern single-target watchOS app (no separate WatchKit
  # Extension target needed since watchOS 9 / Xcode 14). Talks to the phone over
  # WatchConnectivity only (see WatchConnectivityBridge.swift on the phone side);
  # no shared storage. NOT verified against a real build — added and reasoned
  # through without Xcode or a watchOS simulator available in this environment.
  HoursTrackerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HoursTrackerWatch
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.watchkitapp
        INFOPLIST_FILE: HoursTrackerWatch/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
        ENABLE_PREVIEWS: YES
    info:
      path: HoursTrackerWatch/Info.plist
      properties:
        CFBundleDisplayName: HoursTracker
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.hourstracker.app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleLocalizations:
          - en
          - ar
          - he
