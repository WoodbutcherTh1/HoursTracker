name: HoursTracker
options:
  bundleIdPrefix: com.hourstracker
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  HoursTrackerKit:
    path: HoursTrackerKit

targets:
  HoursTracker:
    type: application
    platform: iOS
    sources:
      - path: HoursTracker
        excludes:
          - Info.plist
    resources:
      - path: HoursTracker/Resources
    dependencies:
      - package: HoursTrackerKit
      - target: HoursTrackerWatch
        embed: true
      - target: HoursTrackerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app
        INFOPLIST_FILE: HoursTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: HoursTracker/HoursTracker.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: HoursTracker/HoursTracker.entitlements
    scheme:
      testTargets:
        - HoursTrackerTests
        - HoursTrackerUITests
    info:
      path: HoursTracker/Info.plist
      properties:
        CFBundleDisplayName: HoursTracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "13"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationAlwaysAndWhenInUseUsageDescription: "Always location is used only for workplace arrival reminders via a single geofence around the workplace you saved. We do not continuously track you."
        NSLocationWhenInUseUsageDescription: "HoursTracker uses your location while using the app only to save your workplace when you tap Set Location."
        NSCameraUsageDescription: "HoursTracker uses the camera only to photograph a printed timesheet so you can import clock-in and clock-out times."
        NSPhotoLibraryUsageDescription: "HoursTracker needs photo access only to import a timesheet screenshot or image you choose."
        NSFaceIDUsageDescription: "HoursTracker uses Face ID only to unlock the app when App Lock is enabled."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hourstracker.app
            CFBundleURLSchemes:
              - hourstracker
        CFBundleLocalizations:
          - en
          - ar
          - he

  HoursTrackerWatch:
    type: application
    platform: watchOS
    sources:
      - path: HoursTrackerWatch
        excludes:
          - Info.plist
    resources:
      - path: HoursTrackerWatch/Resources
      - path: HoursTracker/Resources/Localizable.xcstrings
    dependencies:
      - package: HoursTrackerKit
      - target: HoursTrackerWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        CODE_SIGN_ENTITLEMENTS: HoursTrackerWatch/HoursTrackerWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HoursTrackerWatch/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "4"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: HoursTrackerWatch/HoursTrackerWatch.entitlements
    scheme:
      testTargets:
        - HoursTrackerWatchTests
        - HoursTrackerWatchUITests

  HoursTrackerWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - HoursTrackerWatchUITests
    dependencies:
      - target: HoursTrackerWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HoursTrackerWatch

  HoursTrackerWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: HoursTrackerWatchWidgets
        excludes:
          - Info.plist
    dependencies:
      - package: HoursTrackerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.watchkitapp.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        CODE_SIGN_ENTITLEMENTS: HoursTrackerWatchWidgets/HoursTrackerWatchWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HoursTrackerWatchWidgets/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "13"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    entitlements:
      path: HoursTrackerWatchWidgets/HoursTrackerWatchWidgets.entitlements

  HoursTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HoursTrackerWidgets
        excludes:
          - Info.plist
    dependencies:
      - package: HoursTrackerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        CODE_SIGN_ENTITLEMENTS: HoursTrackerWidgets/HoursTrackerWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HoursTrackerWidgets/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "13"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    entitlements:
      path: HoursTrackerWidgets/HoursTrackerWidgets.entitlements

  HoursTrackerWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - HoursTrackerWatchTests
    dependencies:
      - target: HoursTrackerWatch
      - package: HoursTrackerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES

  HoursTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HoursTrackerTests
    dependencies:
      - target: HoursTracker
      - package: HoursTrackerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.tests
        GENERATE_INFOPLIST_FILE: YES

  HoursTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HoursTrackerUITests
    dependencies:
      - target: HoursTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HoursTracker
