name: HoursTracker
# Local-only Telegram feedback secrets (see HoursTracker/Config/Secrets.xcconfig) —
# committed with empty values since this repo is public. Must be a top-level key,
# not nested under `settings:` — XcodeGen ignores it silently there.
configFiles:
  Debug: HoursTracker/Config/Secrets.xcconfig
  Release: HoursTracker/Config/Secrets.xcconfig
options:
  bundleIdPrefix: com.hourstracker
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  # Apple requires the iOS 26 SDK (Xcode 26+) for all App Store submissions
  # as of 28 April 2026. Build with Xcode 26.x locally before archiving.
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
# Account sign-up / sync backend (see HoursTracker/Managers/SupabaseAuthManager.swift
# and SupabaseAccountSyncManager.swift). The project URL + publishable key in
# SupabaseConfig.swift are not secrets — they're meant to ship in the client;
# access is enforced by Postgres Row Level Security, not by hiding the key.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  HoursTracker:
    type: application
    platform: iOS
    sources:
      - path: HoursTracker
        excludes:
          - Info.plist
          - Config/Secrets.xcconfig
      # Shared widget bridge — compiled into BOTH the app and the widget
      # extension so ActivityKit + App Group data types are identical.
      - path: HoursTrackerWidget/WidgetBridge.swift
    resources:
      - path: HoursTracker/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app
        INFOPLIST_FILE: HoursTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: HoursTracker/HoursTracker.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HoursTrackerWidget
        embed: true
      - target: HoursTrackerWatch
        embed: true
      - package: Supabase
        product: Supabase
    entitlements:
      path: HoursTracker/HoursTracker.entitlements
    scheme:
      testTargets:
        - HoursTrackerTests
        - HoursTrackerUITests
    info:
      path: HoursTracker/Info.plist
      properties:
        CFBundleDisplayName: HoursTracker
        # 1.2 and 1.3 were already approved on the App Store, and App Store Connect
        # already has a 1.5 entry on record — each pre-release train is permanently
        # closed to new TestFlight builds once superseded, so any new submission needs
        # a higher marketing version even if it's otherwise a minor update.
        CFBundleShortVersionString: "1.6"
        # Build 15+: do NOT add UIBackgroundModes: location (Guideline 2.5.4).
        # Arrival reminders use CLCircularRegion monitoring only.
        CFBundleVersion: "21"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationAlwaysAndWhenInUseUsageDescription: "Always access is used only for optional workplace arrival reminders via region monitoring (one geofence you set). HoursTracker does not continuously track your location in the background."
        NSLocationWhenInUseUsageDescription: "HoursTracker uses your location while using the app only to save your workplace when you tap Set Location."
        NSCameraUsageDescription: "HoursTracker uses the camera only to photograph a printed timesheet so you can import clock-in and clock-out times."
        NSPhotoLibraryUsageDescription: "HoursTracker needs photo access only to import a timesheet screenshot or image you choose."
        NSFaceIDUsageDescription: "HoursTracker uses Face ID only to unlock the app when App Lock is enabled."
        ITSAppUsesNonExemptEncryption: false
        # Deep links from the widget (interactive buttons + widgetURL) and the
        # home-screen quick actions (long-press icon).
        CFBundleURLTypes:
          - CFBundleURLName: com.hourstracker.app
            CFBundleURLSchemes:
              - hourstracker
        CFBundleLocalizations:
          - en
          - ar
          - he
        # Populated from HoursTracker/Config/Secrets.xcconfig (local-only, gitignored
        # values) — read at runtime by TelegramFeedbackConfig.swift.
        TelegramBotToken: "$(TELEGRAM_BOT_TOKEN)"
        TelegramChatID: "$(TELEGRAM_CHAT_ID)"
  HoursTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HoursTrackerTests
    dependencies:
      - target: HoursTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.tests
        GENERATE_INFOPLIST_FILE: YES
  HoursTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HoursTrackerUITests
    dependencies:
      - target: HoursTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HoursTracker
  HoursTrackerWatch:
    type: application
    platform: watchOS
    sources:
      - path: HoursTrackerWatch
        excludes:
          - Info.plist
      # Shared wire format for phone <-> Watch state (see WatchConnectivityManager) —
      # compiled into both the app and the Watch app, same pattern as WidgetBridge.swift.
      - path: HoursTracker/Shared/WatchSnapshot.swift
    resources:
      - path: HoursTrackerWatch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.watchkitapp
        INFOPLIST_FILE: HoursTrackerWatch/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  HoursTrackerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HoursTrackerWidget
        excludes:
          # Design mockup for the widget UI — not part of the extension.
          - Mockup.html
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourstracker.app.widget
        INFOPLIST_FILE: HoursTrackerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: HoursTrackerWidget/HoursTrackerWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FQUC6DU87N
    entitlements:
      path: HoursTrackerWidget/HoursTrackerWidget.entitlements
