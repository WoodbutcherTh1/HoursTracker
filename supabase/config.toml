# Only the per-function settings are used; the rest of the project config
# lives in the Supabase dashboard.
project_id = "rocjprrvrvmtisxnvopg"

[functions.submit-feedback]
verify_jwt = true

# The app's publishable key is not a JWT, so these two verify the caller
# themselves (auth.getUser + the admins table) instead of at the gateway.
[functions.register-device]
verify_jwt = false

[functions.admin-api]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

# Same reasoning as admin-api: the publishable key is not a JWT. support-chat
# reads an optional user session itself; support-admin checks the admins table.
[functions.support-chat]
verify_jwt = false

[functions.support-admin]
verify_jwt = false
